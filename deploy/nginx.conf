# ─────────────────────────────────────────────────────────────────────────────
# IYKA-ARAM — nginx site config
#
# Install to /etc/nginx/sites-available/iyka-aram and symlink into
# sites-enabled. Certbot rewrites this file when it installs the certificate,
# adding the listen 443 block and the redirect — run it after this is in place.
# ─────────────────────────────────────────────────────────────────────────────

# Modest request ceiling as a second line of defence in front of the app's own
# limiter. 30r/m with burst=10 is far above what a person browsing produces but
# well below what a script does. $binary_remote_addr is the real socket peer, so
# this cannot be spoofed the way a header can.
limit_req_zone $binary_remote_addr zone=iyka_post:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name iyka-aram.com www.iyka-aram.com;

    # Enquiry payloads are tiny; anything larger is not from our form.
    client_max_body_size 2m;
    client_body_timeout 15s;

    # Don't advertise the nginx version on errors.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Static assets served straight off disk ───────────────────────────────
    # Keeps 97MB of testimonial video off the Node process entirely. Next
    # fingerprints everything under /_next/static, so it is safe to cache hard.
    location /_next/static/ {
        alias /srv/iyka-web/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /videos/ {
        alias /srv/iyka-web/public/videos/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Application ──────────────────────────────────────────────────────────
    location / {
        # Server Actions arrive as POSTs to the page URL, so the limit is
        # applied by method rather than by path.
        limit_except GET HEAD {
            limit_req zone=iyka_post burst=10 nodelay;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # SECURITY — set, never append.
        #
        # The usual $proxy_add_x_forwarded_for APPENDS to whatever the client
        # sent, so a caller can put a made-up address in front and the app reads
        # that as the client. Every request would land in a fresh rate-limit
        # bucket and the per-IP limits would do nothing. $remote_addr is the
        # real TCP peer and overwrites any header the client supplied, which is
        # what src/app/(site)/actions.ts documents as its assumption.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
